name: Actualizar contexto (gamma + noticias)

# Datos institucionales tipo SpotGamma: corre de forma moderada (cada 30 min en
# horario de mercado US) y publica un JSON pequeno en data/gex.json.
# El computo pesado ocurre aqui, no en el navegador.

on:
  workflow_dispatch:        # ejecucion manual
  schedule:
    # cada 15 min, Lun-Vie, ~12:00-21:45 UTC (premarket a cierre NY). Cron en UTC.
    - cron: "*/15 12-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: gex-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcular GEX (CBOE)
        run: python tools/build_gex.py || true

      - name: Analizar contexto de noticias (Google News)
        run: python tools/build_news.py || true

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gex.json data/news.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: actualizar gamma y contexto de noticias [skip ci]"
            git push
          fi
